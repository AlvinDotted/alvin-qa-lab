name: API Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest  # 或 self-hosted

    strategy:
      matrix:
        env: [test]   # 可并行跑 test、uat 两个环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check DNS resolution (DDNS)
        run: |
          echo "=== Checking DNS resolution for ucsdev.ddns.net ==="
          nslookup ucsdev.ddns.net || echo "❌ DNS resolution failed"
          dig ucsdev.ddns.net || echo "❌ dig failed"

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn dnsutils netcat-openbsd

      - name: Write VPN config
        env:
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
        run: |
          echo "$OVPN_CONFIG" | base64 -d > /tmp/client.ovpn
          chmod 600 /tmp/client.ovpn

      - name: Connect VPN
        env:
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > /tmp/auth.txt
          chmod 600 /tmp/auth.txt
          sudo openvpn --config /tmp/client.ovpn --auth-user-pass /tmp/auth.txt --daemon
          sleep 15
          sudo cat openvpn.log || sudo tail -n 20 openvpn.log || true  
          echo "=== Checking VPN interface ==="
          ip addr show tun0 || echo "tun0 not found"

      - name: Verify VPN connection
        env:
          PUBLIC_DOMAIN: ${{ secrets.PUBLIC_DOMAIN }}
        run: |
          echo "=== Checking network interfaces ==="
          ip addr show
          echo "=== Checking VPN process ==="
          ps aux | grep openvpn || echo "No openvpn process"
          echo "=== Testing connectivity to backend ==="
          curl -v --connect-timeout 10 http://${PUBLIC_DOMAIN} || echo "Backend unreachable"
          echo "=== Testing Redis connectivity ==="
          nc -zv ${PUBLIC_DOMAIN} 6379 || echo "Redis unreachable"
      
      - name: Install Allure
        run: |
          npm install -g allure@3.15.0
          allure --version

      - name: Run tests
        env:
          ENV: ${{ matrix.env }}
          # 账号密码 Secret（不带环境前缀）
          PUBLIC_DOMAIN: ${{ secrets.PUBLIC_DOMAIN }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_1_USERNAME: ${{ secrets.ADMIN_1_USERNAME }}
          ADMIN_1_PASSWORD: ${{ secrets.ADMIN_1_PASSWORD }}
          ADMIN_2_USERNAME: ${{ secrets.ADMIN_2_USERNAME }}
          ADMIN_2_PASSWORD: ${{ secrets.ADMIN_2_PASSWORD }}
          ADMIN_3_USERNAME: ${{ secrets.ADMIN_3_USERNAME }}
          ADMIN_3_PASSWORD: ${{ secrets.ADMIN_3_PASSWORD }}
          ADMIN_4_USERNAME: ${{ secrets.ADMIN_4_USERNAME }}
          ADMIN_4_PASSWORD: ${{ secrets.ADMIN_4_PASSWORD }}
          ADMIN_5_USERNAME: ${{ secrets.ADMIN_5_USERNAME }}
          ADMIN_5_PASSWORD: ${{ secrets.ADMIN_5_PASSWORD }}
          PROJECT_ENGINEERING_USERNAME: ${{ secrets.PROJECT_ENGINEERING_USERNAME }}
          PROJECT_ENGINEERING_PASSWORD: ${{ secrets.PROJECT_ENGINEERING_PASSWORD }}
        run: python run.py --env ${{ matrix.env }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.env }}
          path: reports/${{ matrix.env }}/

      - name: Disconnect VPN
        if: always()
        run: |
          sudo pkill -f openvpn || true
          rm -f /tmp/auth.txt
      
[pytest]

# 1. 测试发现规则，指定测试文件、类、函数的匹配模式（默认已包含 test_*.py，但写明确更安全）
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 2. 测试路径，指定 pytest 从哪些目录开始收集测试用例（默认当前目录）
testpaths = tests

# 3. 命令行默认参数（addopts），注意：这里配置的是“默认值”，如果命令行显式指定了参数，会覆盖这里；
#    报告路径已由 conftest.py 动态接管
addopts =
    # 执行控制
    -v                                       # 显示详细测试结果
    --tb=short                               # 报错时显示精简堆栈（便于阅读）
    --strict-markers                         # 严格模式：未注册的 marker 会报错
    --maxfail=1                              # 本地调试，失败 1 条用例即停止（CI 里用命令行覆盖（pytest --maxfail=0））
    --clean-alluredir                        # 每次运行前清空 Allure 目录，避免历史数据干扰
    --html=reports/html/report.html          # 激活插件，实际路径由 conftest.py 接管
    --alluredir=reports/allure-results       # 激活插件，实际路径由 conftest.py 接管
    
    # 并行执行（可选，需安装 pytest-xdist）
    # -n auto                                # 自动使用 CPU 核心数并行跑

# 4. 标记（Markers）注册（可选，但推荐），注册自定义 marker，用于用例分类和筛选（如冒烟测试、回归测试）
markers =
    smoke: 冒烟测试用例（核心功能）
    regression: 回归测试用例
    p0: 优先级 P0 用例（阻断级）
    p1: 优先级 P1 用例（严重级）
    p2: 优先级 P2 用例（一般级）
    slow: 执行时间较长的用例

# 5. 日志格式配置（与 logger.py 互补）
log_cli = true                              
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 6. 其他常用配置，忽略某些目录（如虚拟环境、临时文件）
norecursedirs = .git .pytest_cache venv env .env .idea .vscode logs reports
# 失败重跑（需安装 pytest-rerunfailures）
# reruns = 2                              # 失败用例重跑 2 次
# reruns_delay = 1                        # 重跑间隔 1 秒
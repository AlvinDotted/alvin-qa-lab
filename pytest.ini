[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
norecursedirs = .git .pytest_cache venv env .env .idea .vscode logs reports
addopts =
    -v                                       
    --tb=short                               
    --strict-markers                         
    --maxfail=10                             
    --clean-alluredir                    

markers =
    smoke: smoke test
    regression: regression test
    p0: P0
    p1: P1
    p2: P2

log_cli = true                              
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
